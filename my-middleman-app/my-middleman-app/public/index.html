<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>trial</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #eef2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .phone-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
      border: 1px solid #e0e0e0;
    }

    .banner {
      background: linear-gradient(135deg, #0066ff, #0044cc);
      color: white;
      padding: 22px 15px;
      text-align: center;
    }
    
    .banner h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: lowercase;
    }

    .content {
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .question-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .question-group label {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    .question-group input[type="text"],
    .question-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .question-group input[type="text"]:focus,
    .question-group select:focus {
      border-color: #0066ff;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #0066ff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background-color: #0044cc;
    }

    #status {
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      word-break: break-all;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0066ff;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin: 12px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="phone-card">
    <div class="banner">
      <h1>trial</h1>
    </div>

    <div class="content">

      <div class="question-group">
        <label for="moodSelect">1. How is your day going?</label>
        <select id="moodSelect">
          <option value="great">Great 😁</option>
          <option value="good">Good 🙂</option>
          <option value="busy">Busy 🏃‍♂️</option>
        </select>
      </div>

      <div class="question-group">
        <label for="colorInput">2. What is your favorite color?</label>
        <input type="text" id="colorInput" placeholder="e.g. Violet, Crimson, Cyan">
      </div>

      <div class="question-group">
        <label for="animalInput">3. Favorite animal?</label>
        <input type="text" id="animalInput" placeholder="e.g. Dolphin, Eagle">
      </div>

      <button class="submit-btn" onclick="sendToMiddleman()">Submit Request</button>

      <div id="status"></div>
    </div>
  </div>

  <script>
    async function sendToMiddleman() {
      const color = document.getElementById('colorInput').value.trim();
      const statusDiv = document.getElementById('status');

      if (!color) {
        alert('Please answer question 2!');
        return;
      }

      statusDiv.style.color = '#0066ff';
      statusDiv.innerHTML = `
        <div class="spinner"></div>
        <p>Please wait... processing your request</p>
      `;

      try {
        // Relative API route
        const res = await fetch('/api/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ color: color })
        });

        const data = await res.json();
        const requestId = data.requestId;

        // Poll relative API route
        const interval = setInterval(async () => {
          const checkRes = await fetch(`/api/status/${requestId}`);
          const checkData = await checkRes.json();

          if (checkData.status === 'COMPLETED') {
            clearInterval(interval);

            statusDiv.style.color = 'green';
            statusDiv.innerHTML = `<p>Link received! Redirecting...</p>`;

            setTimeout(() => {
              window.location.href = checkData.link;
            }, 600);
          }
        }, 2000);

      } catch (err) {
        statusDiv.style.color = 'red';
        statusDiv.textContent = 'Could not connect to Middleman server.';
      }
    }
  </script>

</body>
</html>
