<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trial</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #eef2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    /* Mobile Phone Wrapper */
    .phone-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
      border: 1px solid #e0e0e0;
    }

    /* Top Black Banner */
    .banner {
      background: #000000;
      color: #ffffff;
      padding: 22px 15px;
      text-align: center;
    }
    
    .banner h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Form Content */
    .content {
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .question-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .question-group label {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    .question-group input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .question-group input[type="text"]:focus {
      border-color: #000000;
    }

    /* Continue Button */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #000000;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background-color: #222222;
    }

    /* Status Spinner & Messages */
    #status {
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      word-break: break-all;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #000000;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin: 12px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="phone-card">
    
    <!-- Black Header Banner -->
    <div class="banner">
      <h1>Trial</h1>
    </div>

    <!-- 4 Short Answer Questions -->
    <div class="content">

      <div class="question-group">
        <label for="q1">1. What is your full name?</label>
        <input type="text" id="q1" placeholder="e.g. John Doe">
      </div>

      <div class="question-group">
        <label for="q2">2. What is your email address?</label>
        <input type="text" id="q2" placeholder="e.g. john@example.com">
      </div>

      <div class="question-group">
        <label for="q3">3. What is your favorite color?</label>
        <input type="text" id="q3" placeholder="e.g. Crimson, Blue">
      </div>

      <div class="question-group">
        <label for="q4">4. What city do you live in?</label>
        <input type="text" id="q4" placeholder="e.g. London, New York">
      </div>

      <button class="submit-btn" onclick="sendToMiddleman()">Continue</button>

      <div id="status"></div>
    </div>

  </div>

  <script>
    async function sendToMiddleman() {
      const ans1 = document.getElementById('q1').value.trim();
      const ans2 = document.getElementById('q2').value.trim();
      const ans3 = document.getElementById('q3').value.trim();
      const ans4 = document.getElementById('q4').value.trim();

      const statusDiv = document.getElementById('status');

      if (!ans1 || !ans2 || !ans3 || !ans4) {
        alert('Please answer all 4 questions!');
        return;
      }

      // 1. Show spinner and transfer message
      statusDiv.style.color = '#000000';
      statusDiv.innerHTML = `
        <div class="spinner"></div>
        <p>You are being transferred, wait...</p>
      `;

      // Bundle all answers into one string for the operator dashboard
      const summaryPayload = `Name: ${ans1} | Email: ${ans2} | Color: ${ans3} | City: ${ans4}`;

      try {
        // 2. Post request to middleman API
        const res = await fetch('/api/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ color: summaryPayload })
        });

        const data = await res.json();
        const requestId = data.requestId;

        // 3. Poll status every 2 seconds
        const interval = setInterval(async () => {
          const checkRes = await fetch(`/api/status/${requestId}`);
          const checkData = await checkRes.json();

          if (checkData.status === 'COMPLETED') {
            clearInterval(interval);

            statusDiv.style.color = 'green';
            statusDiv.innerHTML = `<p>Link received! Redirecting...</p>`;

            // 4. Auto-redirect browser tab
            setTimeout(() => {
              window.location.href = checkData.link;
            }, 600);
          }
        }, 2000);

      } catch (err) {
        statusDiv.style.color = 'red';
        statusDiv.textContent = 'Could not connect to Middleman server.';
      }
    }
  </script>

</body>
</html>
